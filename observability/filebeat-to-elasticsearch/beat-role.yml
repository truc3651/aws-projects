---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat-account
  namespace: default # Use the same namespace as your Filebeat resource
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: filebeat-cluster-role
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: filebeat-account
    namespace: default # Use the same namespace as your ServiceAccount
roleRef:
  kind: ClusterRole
  name: filebeat-cluster-role
  apiGroup: rbac.authorization.k8s.io
