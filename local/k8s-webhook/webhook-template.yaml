apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook
webhooks:
  - name: webhook.webhook.svc.cluster.local
    admissionReviewVersions:
      - "v1"
    # It tells the Kubernetes API server that the webhook's operations are safe and idempotent
    sideEffects: "None"
    timeoutSeconds: 30
    objectSelector:
      matchLabels:
        webhook-enabled: "true"
    clientConfig:
      service:
        name: webhook
        namespace: webhook
        path: "/mutate"
      caBundle: ""
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
