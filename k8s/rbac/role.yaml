apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: engineer
  namespace: default
rules:
  - apiGroups: [""] # "" indicates the core API group
    resources: ["pods", "pods/exec"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["app"]
    resources: ["deployments"]
    verbs: ["get", "watch", "list"]
