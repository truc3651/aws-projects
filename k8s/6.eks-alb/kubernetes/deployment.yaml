apiVersion: apps/v1
kind: Deployment
metadata:
  name: echoserver
  namespace: dev
spec:
  selector:
    matchLabels:
      app: echoserver
  replicas: 1
  template:
    metadata:
      labels:
        app: echoserver
    spec:
      containers:
        - image: k8s.gcr.io/e2e-test-images/echoserver:2.5
          name: echoserver
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: echoserver
  namespace: dev
spec:
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: NodePort
  selector:
    app: echoserver
