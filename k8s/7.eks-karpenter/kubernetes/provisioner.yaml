---
apiVersion: karpenter.sh/v1alpha5
kind: Provisioner # resource for creating new nodes if needed
metadata:
  name: default
spec:
  ttlSecondsAfterEmpty: 60 # remove nodes after 60 seconds without pods running
  # Regularly replacing nodes ensures they run newer AMIs with the latest security patches and updates
  # Without node rotation, you might have nodes running outdated and potentially vulnerable software.
  # In some cases, AWS offers better pricing for instances that can be interrupted or replaced
  ttlSecondsUntilExpired: 604800
  limits:
    resources:
      cpu: 100 # limit to 100 CPU cores
  requirements:
    - key: karpenter.k8s.aws/instance-family
      operator: In
      values: [c5, m5, r5]
    - key: karpenter.k8s.aws/instance-size
      operator: NotIn
      values: [nano, micro, small, large]
  providerRef:
    name: my-provider
---
apiVersion: karpenter.k8s.aws/v1alpha1
kind: AWSNodeTemplate
metadata:
  name: my-provider
spec:
  subnetSelector:
    kubernetes.io/cluster/demo: owned
  securityGroupSelector:
    kubernetes.io/cluster/demo: owned
