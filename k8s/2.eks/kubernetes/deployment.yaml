apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: dev
spec:
  # pod autoscale
  # replicas: 1

  # cluster autoscale
  replicas: 5
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: aputra/myapp-195:v2
          ports:
            - name: http
              containerPort: 8080
          # resources:
          #   requests:
          #     memory: 256Mi
          #     cpu: 100m
          #   limits:
          #     memory: 256Mi
          #     cpu: 100m
          resources:
            requests:
              memory: 512Mi
              cpu: 500m
            limits:
              memory: 512Mi
              cpu: 500m
